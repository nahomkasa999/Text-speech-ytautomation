name: Build Standalone Desktop Apps (Windows & Linux)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: book-narrator-linux.tar.gz
            cmd: tar -czf book-narrator-linux.tar.gz -C dist book-narrator
          - os: windows-latest
            artifact_name: book-narrator-windows.zip
            cmd: Compress-Archive -Path dist\book-narrator -DestinationPath book-narrator-windows.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Download Kokoro Model Weights
        run: |
          mkdir -p models
          curl -L -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -L -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm book_narrator.spec

      - name: Package Bundle
        run: ${{ matrix.cmd }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

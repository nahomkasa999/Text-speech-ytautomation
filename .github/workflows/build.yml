name: Build Desktop Apps (Windows installer + portable exe, Linux)

# Releases & updates
# - Every push to main publishes a small in-app update (a few hundred KB of app
#   code) to the "updates" release. Installed apps pick it up and ask the user
#   to update. No full installer is built unless the engine changed.
# - Full installers (Setup.exe, portable exe, Linux) are built and released when:
#   you run this workflow by hand, push a v* tag, or a push changes the engine
#   (requirements.txt, book_narrator.spec, app_boot.py or desktop.py).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Executable name (no spaces)'
        required: true
        default: 'book-narrator'
        type: string
      bundle_models:
        description: 'Bundle Kokoro voice model inside the app (works offline right after install)?'
        required: true
        default: true
        type: boolean
      show_console:
        description: 'Show a debug console window on launch?'
        required: true
        default: false
        type: boolean
      model_url:
        description: 'Kokoro ONNX model download URL'
        required: false
        default: 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx'
        type: string
      voices_url:
        description: 'Kokoro voices.bin download URL'
        required: false
        default: 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin'
        type: string
      publish_release:
        description: 'Publish the finished files as a GitHub Release (a public download page)?'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  APP_NAME: ${{ github.event.inputs.app_name || 'book-narrator' }}
  BUNDLE_MODELS: ${{ github.event.inputs.bundle_models || 'true' }}
  SHOW_CONSOLE: ${{ github.event.inputs.show_console || 'false' }}
  MODEL_URL: ${{ github.event.inputs.model_url || 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx' }}
  VOICES_URL: ${{ github.event.inputs.voices_url || 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin' }}

jobs:
  # ---- Small in-app update package (every run) ----
  update:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      engine_changed: ${{ steps.engine.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build update package
        id: pkg
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/make_update_package.py \
            --version "${{ steps.ver.outputs.version }}" \
            --build "${{ steps.ver.outputs.build }}" \
            --repo "${{ github.repository }}" \
            --notes "${NOTES:-$(git log -1 --format=%B)}"

      - name: Did the engine change? (then users need the full installer)
        id: engine
        shell: bash
        run: |
          published=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/updates/update.json" 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('engine',''))" 2>/dev/null || true)
          echo "published engine: '${published}', new engine: '${{ steps.pkg.outputs.engine }}'"
          if [[ "${published}" != "${{ steps.pkg.outputs.engine }}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep update files for publishing
        uses: actions/upload-artifact@v4
        with:
          name: update-channel
          path: dist/update-channel/*

      - name: Keep version.json for the installers
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: version.json

  # ---- Full installers (only when needed) ----
  build:
    needs: update
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || needs.update.outputs.engine_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Work out version
        shell: bash
        run: echo "APP_VERSION=${{ needs.update.outputs.version }}" >> "$GITHUB_ENV"

      - name: Add version.json (lets the installed app receive in-app updates)
        uses: actions/download-artifact@v4
        with:
          name: version-info
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --only-binary=:all: --force-reinstall imageio-ffmpeg==0.6.0

      - name: Cache Kokoro model files
        if: ${{ env.BUNDLE_MODELS == 'true' }}
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-models-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Download Kokoro model files
        if: ${{ env.BUNDLE_MODELS == 'true' }}
        shell: bash
        run: |
          mkdir -p models
          [ -s models/kokoro-v1.0.onnx ] || curl -fL -o models/kokoro-v1.0.onnx "$MODEL_URL"
          [ -s models/voices-v1.0.bin ]  || curl -fL -o models/voices-v1.0.bin  "$VOICES_URL"
          ls -la models

      # ---- Windows: installer (recommended) + portable single exe ----
      - name: Build app folder (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ONEFILE: 'false'
        run: pyinstaller --noconfirm book_narrator.spec

      - name: Smoke test packaged Windows CPU encoders
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpeg = (Resolve-Path "dist/$env:APP_NAME/_internal/ffmpeg/ffmpeg.exe").Path
          python -m src.ffmpeg_runtime "$ffmpeg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ffmpeg -hide_banner -nostdin -y -f lavfi -i "color=c=black:s=320x180:r=10:d=0.3" -f lavfi -i "sine=frequency=440:duration=0.3" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$env:RUNNER_TEMP/smoke.mp4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ffmpeg -hide_banner -nostdin -y -f lavfi -i "color=c=black:s=320x180:r=10:d=0.3" -f lavfi -i "sine=frequency=440:duration=0.3" -c:v libvpx-vp9 -c:a libopus -shortest "$env:RUNNER_TEMP/smoke.webm"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('smoke.mp4', 'smoke.webm')) {
            & $ffmpeg -v error -nostdin -i "$env:RUNNER_TEMP/$file" -f null -
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($file in @('FFMPEG-NOTICE.txt', 'GPL-3.0.txt', 'imageio-ffmpeg-LICENSE.txt', 'ffmpeg-build.txt')) {
            if (-not (Test-Path "dist/$env:APP_NAME/_internal/licenses/$file")) { throw "Missing license: $file" }
          }

      - name: Build portable single exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          ONEFILE: 'true'
        run: pyinstaller --noconfirm --distpath dist/portable --workpath build/portable book_narrator.spec

      - name: Install Inno Setup (if missing)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Build Setup.exe installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DAppExeName=$env:APP_NAME" installer\book_narrator.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Windows release files
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp "dist/installer/BookNarrator-Setup-${APP_VERSION}.exe" release/
          cp "dist/portable/${APP_NAME}.exe" "release/BookNarrator-Portable-${APP_VERSION}.exe"
          ls -la release

      # Small engine patch: only the files that differ from the previous engine
      # release (so installed apps do not need the whole ~400 MB installer).
      - name: Build engine patch (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o prev-engine-files.json "https://github.com/${{ github.repository }}/releases/download/updates/engine-files.json" || rm -f prev-engine-files.json
          ENGINE=$(python3 -c "import json;print(json.load(open('version.json'))['engine'])")
          python3 scripts/make_engine_patch.py --dist "dist/${APP_NAME}" --version "${APP_VERSION}" \
            --engine "$ENGINE" --prev prev-engine-files.json --out release
          ls -la release

      # ---- Linux: folder bundle ----
      - name: Build app folder (Linux)
        if: runner.os == 'Linux'
        env:
          ONEFILE: 'false'
        run: pyinstaller --noconfirm book_narrator.spec

      - name: Collect Linux release files
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf "release/BookNarrator-Linux-${APP_VERSION}.tar.gz" -C dist "${APP_NAME}"
          ls -la release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookNarrator-${{ matrix.platform }}
          path: release/*

  release:
    needs: [update, build]
    if: >-
      needs.build.result == 'success' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') ||
        (github.event_name == 'push' && needs.update.outputs.engine_changed == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: BookNarrator-*
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes use their own tag; manual runs create v1.0.<run number> on the built commit.
          tag_name: v${{ needs.update.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          body: |
            ### Download for Windows
            - **BookNarrator-Setup-*.exe** (recommended): double-click, it installs in seconds (no admin needed) and opens in ~2 s every time.
            - **BookNarrator-Portable-*.exe**: no install, just run it. Slower to open (unpacks itself on every launch, ~5-20 s).

            Windows SmartScreen may say "Windows protected your PC" because the app is not code-signed yet: click **More info -> Run anyway**.

  # ---- Publish the in-app update (installed apps check this) ----
  publish-update:
    needs: [update, build, release]
    # If the engine changed, wait until the new installer is released, so the
    # installer fields in update.json never point at an old installer.
    if: >-
      always() && needs.update.result == 'success' &&
      (needs.update.outputs.engine_changed != 'true' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (for the manifest script)
        uses: actions/checkout@v4

      - name: Download update files
        uses: actions/download-artifact@v4
        with:
          name: update-channel
          path: update-channel

      # Only when this run released a new installer: add its direct URL, size
      # and SHA-256 to update.json so the app can download and install it itself.
      - name: Download the new installer (if one was built)
        if: needs.release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: BookNarrator-*
          path: release
          merge-multiple: true

      - name: Add installer details to update.json
        run: |
          # Keep the file list of this engine so the next engine patch can diff against it.
          [ -f release/engine-files.json ] && cp release/engine-files.json update-channel/ || true
          # The currently published manifest: its installer/tarball/patch entries are
          # carried forward when this run did not build new ones for the same engine.
          curl -fsSL -o prev-update.json "https://github.com/${{ github.repository }}/releases/download/updates/update.json" || rm -f prev-update.json
          python3 scripts/add_installer_to_manifest.py \
            --manifest update-channel/update.json \
            --search-dir release \
            --repo "${{ github.repository }}" \
            --previous prev-update.json

      - name: Publish to the "updates" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updates
          name: In-app updates (used by the app's updater)
          prerelease: true
          make_latest: false
          files: update-channel/*
          body: |
            This release is used by the app's built-in updater. To install the app, download the latest **BookNarrator-Setup** from the newest regular release instead.

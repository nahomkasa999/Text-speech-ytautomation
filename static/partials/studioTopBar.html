<!-- Top Video Studio Action Bar (Figma / CapCut Top Bar) -->
<header class="workspace-header video-top-bar">
  <div class="top-bar-left">
    <button id="btn-toggle-left-panel" class="panel-toggle-btn active" title="Toggle Left Sidebar (Ctrl+B)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
    </button>
    <button id="btn-toggle-timeline" class="panel-toggle-btn active" title="Toggle Timeline (Ctrl+J)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 15h18"/></svg>
    </button>
    <div class="top-divider"></div>
    <!-- Undo / Redo -->
    <button id="btn-undo" class="panel-toggle-btn" title="Undo (Ctrl+Z)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    </button>
    <button id="btn-redo" class="panel-toggle-btn" title="Redo (Ctrl+Y)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
    </button>
    <div class="top-divider"></div>
    <!-- Import Media -->
    <button id="btn-import-media" class="tool-btn" title="Import Media (Video, Audio, Image)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>Import</span>
    </button>
    <input type="file" id="media-importer-file" accept="image/*,video/*,audio/*" multiple style="display: none;" />
    <!-- Captions & Text Presets -->
    <button id="btn-restore-captions" class="tool-btn" title="Synced Captions (Click to select or restore)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/></svg>
      <span>Captions</span>
    </button>
    <button id="btn-add-heading" class="tool-btn" title="Add Title / Heading (H)">
      <span>+ Title</span>
    </button>
    <button id="btn-add-subtitle" class="tool-btn" title="Add Subtitle">
      <span>+ Subtitle</span>
    </button>
    <button id="btn-add-text-layer" class="tool-btn" title="Add Custom Text (T)">
      <span class="tool-icon">T</span>
      <span>Text</span>
    </button>
    <label class="tool-btn file-upload-btn" title="Set Background Image">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      <span>Image</span>
      <input type="file" id="bg-image-uploader" accept="image/*" style="display: none;" />
    </label>
    <div class="top-divider"></div>
    <!-- Project Save & Load -->
    <button id="btn-save-project" class="tool-btn" title="Save Project (.videoproj)">
      <span>Save</span>
    </button>
    <button id="btn-load-project" class="tool-btn" title="Open Project (.videoproj)">
      <span>Open</span>
    </button>
    <input type="file" id="project-file-loader" accept=".json,.videoproj" style="display: none;" />
  </div>

  <div class="top-bar-center">
    <span class="project-pill" id="video-project-name">Untitled Project</span>
  </div>

  <div class="top-bar-right">
    <button id="btn-zen-mode" class="panel-toggle-btn" title="Zen Mode (Ctrl+K Z / F11)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    </button>
    <button id="btn-toggle-right-panel" class="panel-toggle-btn active" title="Toggle Right Inspector (Ctrl+Alt+B)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
    </button>
    <div class="top-divider"></div>
    <button id="btn-export-mp4" class="btn btn-success btn-sm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="export-btn-label">Export MP4</span>
    </button>
  </div>
</header>

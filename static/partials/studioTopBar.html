<!-- Video Studio top bar: one menu, undo/redo, and an always-visible Export button -->
<header class="workspace-header video-top-bar">
  <div class="top-bar-left">
    <div class="popover-anchor">
      <button type="button" class="menu-trigger-btn" data-popover="studio-menu" title="Menu: add text, images, media, save or open a project" aria-haspopup="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        <span>Menu</span>
      </button>

      <div id="studio-menu" class="popover menu-popover" role="menu">
        <div class="menu-label">Add to video</div>
        <button id="btn-add-text-layer" class="menu-item" role="menuitem">
          <span class="menu-icon">T</span><span>Text</span><kbd>T</kbd>
        </button>
        <button id="btn-add-heading" class="menu-item" role="menuitem">
          <span class="menu-icon">H</span><span>Title</span>
        </button>
        <button id="btn-add-subtitle" class="menu-item" role="menuitem">
          <span class="menu-icon">S</span><span>Subtitle</span>
        </button>
        <label class="menu-item" role="menuitem">
          <span class="menu-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></span>
          <span>Background image…</span>
          <input type="file" id="bg-image-uploader" accept="image/*" hidden />
        </label>
        <button id="btn-import-media" class="menu-item" role="menuitem">
          <span class="menu-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
          <span>Import video, audio or image…</span>
        </button>

        <div class="menu-sep"></div>
        <div class="menu-label">Project</div>
        <button id="btn-save-project" class="menu-item" role="menuitem">
          <span class="menu-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span>
          <span>Save project…</span>
        </button>
        <button id="btn-load-project" class="menu-item" role="menuitem">
          <span class="menu-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 14l1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg></span>
          <span>Open project…</span>
        </button>

        <div class="menu-sep"></div>
        <button id="btn-zen-mode" class="menu-item" role="menuitem">
          <span class="menu-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></span>
          <span>Focus mode</span><kbd>F11</kbd>
        </button>
      </div>
    </div>
    <input type="file" id="media-importer-file" accept="image/*,video/*,audio/*" multiple hidden />
    <input type="file" id="project-file-loader" accept=".json,.videoproj" hidden />

    <div class="top-divider"></div>
    <button id="btn-undo" class="panel-toggle-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    </button>
    <button id="btn-redo" class="panel-toggle-btn" title="Redo (Ctrl+Y)" aria-label="Redo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
    </button>
  </div>

  <div class="top-bar-right">
    <button id="btn-export-mp4" class="btn btn-success btn-sm export-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="export-btn-label">Export MP4</span>
    </button>
  </div>
</header>

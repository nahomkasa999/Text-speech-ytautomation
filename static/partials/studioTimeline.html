<!-- CAPCUT-STYLE BOTTOM TIMELINE -->
<div id="capcut-timeline-container" class="capcut-timeline-container">
  <!-- Timeline Transport & Speed Bar -->
  <div class="timeline-toolbar">
    <div class="transport-left">
      <button id="btn-video-play" class="transport-btn play-btn" title="Play / Pause (Space)">
        <svg id="video-play-svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button id="btn-video-stop" class="transport-btn" title="Return to Start">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
      <div class="top-divider" style="height: 18px; margin: 0 4px;"></div>
      <!-- Timeline Edit Tools: Split, Trim, Delete -->
      <button id="btn-timeline-split" class="transport-btn" title="Split Clip at Playhead (S)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
      </button>
      <button id="btn-timeline-trim-left" class="transport-btn" title="Trim Start to Playhead ([)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
      <button id="btn-timeline-trim-right" class="transport-btn" title="Trim End to Playhead (])">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
      </button>
      <button id="btn-timeline-delete-clip" class="transport-btn" title="Delete Clip (Del)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <div class="top-divider" style="height: 18px; margin: 0 4px;"></div>
      <span id="video-timecode" class="timeline-timecode">00:00.0 / 00:00.0</span>
    </div>

    <!-- CapCut Audio Controls Deck (Volume & Custom Speed & BGM) -->
    <div class="audio-controls-deck">
      <!-- Voice Volume & Mute -->
      <div class="deck-volume-wrap">
        <button id="btn-audio-mute" class="transport-btn" style="width:26px; height:26px; padding:0; display:flex; align-items:center; justify-content:center;" title="Mute / Unmute Voice">
          <svg id="svg-audio-vol" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
        <input type="range" id="audio-volume-slider" min="0" max="1" step="0.05" value="1" class="audio-slider volume-slider" title="Voice Volume: 100%" />
        <span id="audio-volume-val" class="audio-val-label">100%</span>
      </div>

      <div class="top-divider" style="height: 18px; margin: 0 4px;"></div>

      <!-- Add Background Music (BGM) Controls -->
      <div class="deck-volume-wrap">
        <button id="btn-add-bgm" class="tool-btn" style="padding: 2px 8px; font-size: 11px; height: 26px;" title="Add Background Music">
          <span>🎵 Music</span>
        </button>
        <input type="file" id="bgm-audio-uploader" accept="audio/*" style="display: none;" />
        <button id="btn-bgm-mute" class="transport-btn" style="width:26px; height:26px; padding:0; font-size: 11px;" title="Mute / Unmute Music">🎵</button>
        <input type="range" id="bgm-volume-slider" min="0" max="1" step="0.05" value="0.35" class="audio-slider volume-slider" title="Music Volume: 35%" />
        <span id="bgm-volume-val" class="audio-val-label">35%</span>
      </div>

      <div class="top-divider" style="height: 18px; margin: 0 4px;"></div>

      <!-- Speed Controls -->
      <div class="deck-speed-wrap">
        <span class="speed-label">Speed:</span>
        <input type="range" id="video-speed-slider" min="0.5" max="2.5" step="0.05" value="1.0" class="audio-slider speed-slider" title="Playback Speed" />
        <span id="video-speed-val" class="speed-val-badge">1.00x</span>
        <div class="speed-buttons">
          <button class="speed-btn" data-speed="0.8">0.8x</button>
          <button class="speed-btn active" data-speed="1.0">1.0x</button>
          <button class="speed-btn" data-speed="1.2">1.2x</button>
          <button class="speed-btn" data-speed="1.5">1.5x</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Multi-Track Timeline Stage -->
  <div class="timeline-viewport" id="timeline-viewport">
    <div class="timeline-ruler" id="timeline-ruler"></div>

    <div class="timeline-tracks" id="timeline-tracks">
      <!-- Track 1: Captions -->
      <div class="timeline-track text-track" id="track-subtitles">
        <div class="track-header"><span class="track-icon">T</span> Captions</div>
        <div class="track-lane" id="lane-subtitles"></div>
      </div>

      <!-- Track 2: Visual Media -->
      <div class="timeline-track media-track" id="track-media">
        <div class="track-header"><span class="track-icon">🎬</span> Media</div>
        <div class="track-lane" id="lane-media"></div>
      </div>

      <!-- Track 3: Voice Audio -->
      <div class="timeline-track audio-track" id="track-audio">
        <div class="track-header"><span class="track-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span> Voice</div>
        <div class="track-lane" id="lane-audio">
          <div class="audio-block" id="timeline-audio-block">
            <div class="waveform-ribs" id="waveform-ribs"></div>
          </div>
        </div>
      </div>

      <!-- Track 4: Background Music -->
      <div class="timeline-track bgm-track" id="track-bgm" style="display: none;">
        <div class="track-header"><span class="track-icon">🎵</span> Music</div>
        <div class="track-lane" id="lane-bgm"></div>
      </div>
    </div>

    <!-- Red Playhead Needle -->
    <div class="timeline-playhead" id="timeline-playhead">
      <div class="playhead-head"></div>
      <div class="playhead-line"></div>
    </div>
  </div>
</div>

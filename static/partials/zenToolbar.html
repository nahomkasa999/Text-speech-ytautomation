<!-- Floating Transport Bar for Zen Mode -->
<div id="zen-floating-toolbar" class="zen-floating-toolbar hidden">
  <button id="zen-btn-play" class="transport-btn play-btn" style="width: 24px; height: 24px;" title="Play / Pause">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
  </button>
  <span id="zen-timecode" class="zen-timecode">00:00.0 / 00:00.0</span>
  <div class="top-divider" style="height: 14px; margin: 0 4px;"></div>
  <button id="zen-exit-btn" class="zen-exit-btn" title="Exit Zen Mode (Esc)">Exit Zen</button>
</div>

<!-- Non-blocking floating toast notification container -->
<div id="toast-container" class="toast-container"></div>

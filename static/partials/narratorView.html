<!-- MODE 1: NARRATOR VIEW -->
<div id="narration-view" class="view-panel">
  <!-- Top Meta Bar -->
  <header class="workspace-header">
    <button id="btn-toggle-left-narrator" class="panel-toggle-btn active" title="Toggle Left Sidebar (Ctrl+B)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
    </button>
    <div class="title-input-wrapper">
      <input type="text" id="project-title" class="title-input" placeholder="Untitled Audiobook / Chapter Name..." />
    </div>
    <div class="stats-pills">
      <span id="autosave-status" class="autosave-pill">Saved</span>
      <div class="stat-pill"><span id="stat-words">0</span> words</div>
      <div class="stat-pill"><span id="stat-chars">0</span> chars</div>
      <div class="stat-pill accent"><span id="stat-time">~0m</span> listening</div>
      <button id="btn-quick-switch-video" class="btn btn-primary btn-sm" style="display: inline-flex; align-items: center; gap: 5px; font-weight: 600;" title="Switch to Video Studio Editor">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><polygon points="10 9 15 12 10 15 10 9"/></svg>
        <span>Open Video Studio</span>
      </button>
      <button id="btn-toggle-right-narrator" class="panel-toggle-btn active" title="Toggle Settings Sidebar (Ctrl+Alt+B)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
      </button>
    </div>
  </header>

  <!-- Text Input Area -->
  <div class="editor-container">
    <textarea id="book-text" class="editor-textarea" placeholder="Paste your book text or Markdown here (supports 12,000 to 20,000+ words).

Markdown headers (###), bold (**text**), and bullets are automatically cleaned so they won't be pronounced!

Drag & drop any .txt or .md file right here..."></textarea>
  </div>

  <!-- Live Generation Progress Card -->
  <div id="progress-card" class="progress-card hidden">
    <div class="progress-header">
      <div class="progress-title">
        <span class="pulse-indicator"></span>
        <span id="progress-status-title">Generating Narration...</span>
      </div>
      <div class="progress-stats">
        <span id="progress-chunk-info">Chunk 0 / 0</span>
        <span class="stat-divider">•</span>
        <span id="progress-eta">ETA: Calculating...</span>
      </div>
    </div>
    <div class="progress-bar-track">
      <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
    </div>
    <div class="progress-snippet-box">
      <span class="snippet-label">Speaking:</span>
      <span id="progress-snippet-text" class="snippet-text">Initializing voice model...</span>
    </div>
  </div>

  <!-- Audio Player Deck -->
  <div id="audio-deck" class="audio-deck hidden">
    <div class="deck-top">
      <div class="deck-meta">
        <h3 id="deck-title" class="deck-title">Audiobook Ready</h3>
        <p id="deck-subtitle" class="deck-subtitle">24 kHz • Kokoro-82M</p>
      </div>
      <div class="deck-actions">
        <button id="btn-open-in-video-studio" class="btn btn-secondary btn-sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><polygon points="10 9 15 12 10 15 10 9"/></svg>
          Open in Video Studio
        </button>
        <a id="btn-download-audio" href="#" download="audiobook.wav" class="btn btn-primary btn-sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download (.wav)
        </a>
      </div>
    </div>
    <audio id="main-audio-player" controls class="native-audio-player"></audio>
  </div>

  <!-- Bottom Toolbar -->
  <footer class="workspace-footer">
    <div class="footer-left">
      <label class="btn btn-secondary btn-sm file-upload-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Load File (.txt / .md)
        <input type="file" id="file-uploader" accept=".txt,.md,.text" style="display: none;" />
      </label>
      <button id="btn-clear-text" class="btn btn-ghost btn-sm">Clear Text</button>
    </div>

    <div class="footer-right">
      <button id="btn-generate" class="btn btn-primary btn-lg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="btn-generate-label">Generate Narration</span>
      </button>
    </div>
  </footer>
</div>

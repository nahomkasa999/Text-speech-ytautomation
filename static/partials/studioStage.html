<!-- Canvas Viewport (Figma-style Stage with clean selection boxes) -->
<div class="video-stage-container" id="video-stage-container">
  <div id="canvas-container" class="canvas-container">
    <canvas id="video-canvas" width="1920" height="1080"></canvas>
    <!-- Smart Snapping Guides Overlay -->
    <canvas id="guides-canvas" width="1920" height="1080"></canvas>
    
    <!-- Figma Selection Bounding Box -->
    <div id="figma-selection-box" class="figma-selection-box hidden">
      <div class="selection-tag" id="selection-tag-name">Captions Frame</div>
      <div class="handle nw"></div>
      <div class="handle n"></div>
      <div class="handle ne"></div>
      <div class="handle e"></div>
      <div class="handle se"></div>
      <div class="handle s"></div>
      <div class="handle sw"></div>
      <div class="handle w"></div>
    </div>
  </div>
</div>
